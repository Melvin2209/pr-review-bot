name: 'PR Review Bot'
description: 'Reviews pull requests: size, files without tests, leftover TODO/console.log, new dependencies and their licenses — in one self-updating comment.'
author: 'Melvin2209'

branding:
  icon: 'check-square'
  color: 'purple'

inputs:
  github-token:
    description: 'Token used to read the PR and post the comment. Needs `contents: read` and `pull-requests: write`.'
    required: false
    default: ${{ github.token }}
  config-path:
    description: 'Path of the configuration file, read from the base branch.'
    required: false
    default: '.pr-review.yml'
  fail-on:
    description: 'Fail the job when findings of this severity (or worse) are present: `error`, `warning` or `never`.'
    required: false
    default: 'never'
  min-score:
    description: 'Fail the job when the score is below this value (0-100).'
    required: false
    default: '0'
  comment:
    description: 'Set to `false` to skip the PR comment (the report is still written to the job summary). Defaults to `comment.enabled` from the config.'
    required: false
    default: ''

outputs:
  score:
    description: 'Review score, from 0 to 100.'
  grade:
    description: 'Letter grade derived from the score (A, B, C, D or F).'
  errors:
    description: 'Number of error findings.'
  warnings:
    description: 'Number of warning findings.'
  comment-id:
    description: 'ID of the summary comment that was created or updated.'
  report:
    description: 'Full report as JSON.'

runs:
  using: 'node24'
  main: 'dist/index.js'
