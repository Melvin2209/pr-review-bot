# Publishes a GitHub release for a semver tag (v1.2.3) and moves the major tag (v1)
# so that `uses: owner/pr-review-bot@v1` picks up the new version.
# Triggered by pushing a tag, or from the Actions tab ("Run workflow"), which creates the tag
# for the current version in package.json on the selected branch.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Resolve the release tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$PKG_VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists. Bump the version in package.json first."
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check dist/ is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is not up to date for $TAG"
            exit 1
          fi

      - name: Create the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release $TAG" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$TAG" in v0.*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag $PRERELEASE

      - name: Move major version tag
        run: |
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
