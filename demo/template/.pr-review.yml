# Rules for pr-review-bot — see https://github.com/__OWNER__/pr-review-bot#configuration
size:
  warn: 300
  max: 800

tests:
  severity: warning

leftovers:
  rules:
    - name: TODO
      pattern: '\b(TODO|FIXME)\b'
      severity: warning
    - name: console.log
      pattern: '\bconsole\.(log|debug)\('
      severity: error

dependencies:
  allow:
    add: [MPL-2.0]
